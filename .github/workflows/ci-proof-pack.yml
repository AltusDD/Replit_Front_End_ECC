name: ci-proof-pack

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci_proof_pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute base + changed files
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF" --prune
          git diff --name-only "origin/${BASE_REF}...HEAD" | sed '/^\s*$/d' > changed_files.txt

      - name: Forbidden scan + ci_proof.json/txt
        shell: bash
        run: |
          set -euo pipefail

          TOKENS=("fetch(" "httpGet(" "queryFn" "useQuery" "supabase" "adapter" "endpoint" "VITE_API_BASE_URL")
          TS_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_HEAD_REF}"
          SHA="${GITHUB_SHA}"
          PR="${{ github.event.pull_request.number }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"

          # Determine non_data_lane: true only if all changed files are under src/pages/** or .github/**
          NON_DATA_LANE="true"
          while IFS= read -r f; do
            case "$f" in
              src/pages/*|src/pages/*/*|src/pages/*/*/*|.github/*|.github/*/*) ;;
              *) NON_DATA_LANE="false" ;;
            esac
          done < changed_files.txt

          ACCEPTANCE_CLASS="MANUAL"
          if [ "$NON_DATA_LANE" = "true" ]; then ACCEPTANCE_CLASS="AUTO"; fi

          echo "CI PROOF PACK" > ci_proof.txt
          echo "repo=$REPO" >> ci_proof.txt
          echo "branch=$BRANCH" >> ci_proof.txt
          echo "commit_sha=$SHA" >> ci_proof.txt
          echo "pr_number=$PR" >> ci_proof.txt
          echo "timestamp_utc=$TS_UTC" >> ci_proof.txt
          echo "base_ref=$BASE_REF" >> ci_proof.txt
          echo "" >> ci_proof.txt
          echo "=== git diff --name-only origin/${BASE_REF}...HEAD ===" >> ci_proof.txt
          cat changed_files.txt >> ci_proof.txt
          echo "" >> ci_proof.txt
          echo "=== forbidden scan (changed files only) ===" >> ci_proof.txt

          : > scan.tsv
          HIT_ANY="0"

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            for t in "${TOKENS[@]}"; do
              if grep -Fq "$t" "$f"; then
                echo "$f\t$t\tYES" >> scan.tsv
                echo "FILE=$f TOKEN=$t FORBIDDEN_HIT=YES" >> ci_proof.txt
                HIT_ANY="1"
              else
                echo "$f\t$t\tNO" >> scan.tsv
                echo "FILE=$f TOKEN=$t FORBIDDEN_HIT=NO" >> ci_proof.txt
              fi
            done
          done < changed_files.txt

          python3 - << 'PY'
import json, os, datetime
repo=os.environ.get("GITHUB_REPOSITORY","")
branch=os.environ.get("GITHUB_HEAD_REF","")
sha=os.environ.get("GITHUB_SHA","")
pr=os.environ.get("PR_NUMBER","")
ts=os.environ.get("TS_UTC","")
base_ref=os.environ.get("BASE_REF","")
non_data_lane=os.environ.get("NON_DATA_LANE","false") == "true"
acceptance_class=os.environ.get("ACCEPTANCE_CLASS","MANUAL")

tokens=["fetch(","httpGet(","queryFn","useQuery","supabase","adapter","endpoint","VITE_API_BASE_URL"]

changed=[]
with open("changed_files.txt","r",encoding="utf-8") as f:
  changed=[ln.strip() for ln in f if ln.strip()]

scan={}
# scan per file token -> hit bool
with open("scan.tsv","r",encoding="utf-8") as f:
  for ln in f:
    parts=ln.rstrip("\n").split("\t")
    if len(parts)!=3: continue
    file, tok, hit = parts
    scan.setdefault(file, {})[tok] = (hit=="YES")

obj={
  "metadata":{
    "repo":repo,
    "branch":branch,
    "commit_sha":sha,
    "pr_number":int(pr) if str(pr).isdigit() else pr,
    "timestamp_utc":ts or datetime.datetime.utcnow().replace(microsecond=0).isoformat()+"Z",
    "base_ref":base_ref
  },
  "scope_proof":{
    "diff_name_only":changed
  },
  "forbidden_scan":{
    "tokens":tokens,
    "per_file":scan,
    "zero_hit_assertion": all(not any(v.values()) for v in scan.values()) if scan else True
  },
  "governance_flags":{
    "non_data_lane": non_data_lane,
    "acceptance_class": acceptance_class
  },
  "fe_build_proof":{
    "typecheck_exit_code": None,
    "build_exit_code": None
  }
}
with open("ci_proof.json","w",encoding="utf-8") as out:
  json.dump(obj,out,indent=2,sort_keys=True)
PY

          # FE build + typecheck (record exit codes)
          set +e
          npm ci
          npm run typecheck --if-present
          TYPECHECK_CODE=$?
          npm run build --if-present
          BUILD_CODE=$?
          set -e

          python3 - << PY
import json
p="ci_proof.json"
with open(p,"r",encoding="utf-8") as f: obj=json.load(f)
obj["fe_build_proof"]["typecheck_exit_code"]=${TYPECHECK_CODE}
obj["fe_build_proof"]["build_exit_code"]=${BUILD_CODE}
with open(p,"w",encoding="utf-8") as f: json.dump(obj,f,indent=2,sort_keys=True)
PY

          echo "" >> ci_proof.txt
          echo "=== FE build proof ===" >> ci_proof.txt
          echo "typecheck_exit_code=${TYPECHECK_CODE}" >> ci_proof.txt
          echo "build_exit_code=${BUILD_CODE}" >> ci_proof.txt

          # Hard fail on forbidden token hits
          if [ "$HIT_ANY" = "1" ]; then
            echo "Forbidden token hit detected. Failing job."
            exit 1
          fi
